<!doctype html>
<!-- {{...}} placeholders are filled from guides/<name>/guide.json by scripts/build-web.mjs -->
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
  {{fontFace}}
  :root { {{theme}} --font-body: "{{font.family}}", -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; --font-code: ui-monospace, Menlo, Consolas, monospace; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--fg); font-family: var(--font-body); }
  .page { max-width:1280px; margin:0 auto; padding:24px 16px 48px; }
  .head { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .head h1 { font-size:24px; margin:0; }
  .head span { color:var(--dim); font-size:15px; }
  .player { border-radius:14px; overflow:hidden; background:var(--stage); box-shadow:0 20px 60px var(--shadow); outline:none; }
  .player:focus-visible { box-shadow:0 0 0 2px var(--brand); }
  .player:fullscreen { border-radius:0; display:flex; flex-direction:column; }
  .screen { position:relative; width:100%; aspect-ratio:16/9; overflow:hidden; cursor:pointer; }
  .player:fullscreen .screen { flex:1; aspect-ratio:auto; }
  .big { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:var(--veil); }
  .big span svg { width:50%; height:50%; }
  .big span { width:clamp(56px,14vw,112px); height:clamp(56px,14vw,112px); border-radius:50%; background:var(--brand-big); color:var(--brand-ink);
    display:flex; align-items:center; justify-content:center; padding-left:4px; box-shadow:0 10px 40px var(--big-shadow); font-size:40px; }
  .bar { display:flex; align-items:center; gap:10px; padding:8px 12px; background:var(--bar); border-top:1px solid var(--bar-line); }
  .bar button { background:none; border:0; color:var(--fg); width:36px; height:36px; border-radius:8px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; }
  .bar button:hover { background:var(--hover); }
  .bar button:focus-visible, .toc button:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
  .bar button.rate { width:auto; min-width:52px; padding:0 8px; font:inherit; font-size:14px; font-weight:700; font-variant-numeric:tabular-nums; }
  .time { font-size:14px; color:var(--dim); font-variant-numeric:tabular-nums; min-width:92px; }
  .bar input[type=range] { flex:1; accent-color:var(--brand); min-width:60px; }
  .toc { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
  .toc button { padding:8px 14px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--fg);
    font:inherit; font-size:15px; cursor:pointer; }
  .toc button.on { border-color:var(--brand); background:var(--brand-soft); font-weight:700; }
  .note { color:var(--dim); font-size:14px; margin-top:18px; line-height:1.6; }
  @media (max-width:560px) { .time { min-width:0; font-size:12px; } .head h1 { font-size:20px; } }
</style>
</head>
<body>
<div id="root"></div>
<script src="app.js"></script>
</body>
</html>
