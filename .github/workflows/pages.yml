name: Pages

# Publishes the motion gallery and the sample guide to GitHub Pages on every push to main.
# Skipped while the repository is private.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node scripts/build-gallery.mjs --out site
      - run: node scripts/build-web.mjs --guide first-diagram --out site
      - run: printf '<meta http-equiv="refresh" content="0; url=first-diagram/">' > site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
